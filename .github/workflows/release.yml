name: release
# Owner-run only. Agents never dispatch this workflow, create tags or releases.
# Follow-ups, not done here: crates.io publishing and GHCR images.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the leading v, e.g. 0.1.0; must equal crates/playpilot/Cargo.toml"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    name: Verify version and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not SemVer (MAJOR.MINOR.PATCH[-pre], no leading v)"
            exit 1
          fi
          crate=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "playpilot") | .version')
          if [ "$crate" != "$VERSION" ]; then
            echo "::error::input $VERSION differs from crates/playpilot/Cargo.toml ($crate)"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::run the workflow from main (got $REF)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: rustup target add "$TARGET"
        shell: bash
      - run: cargo build --release --locked -p playpilot --target "$TARGET"
        shell: bash
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name="playpilot-v$VERSION-$TARGET"
          mkdir -p "stage/$name" dist
          cp "target/$TARGET/release/playpilot" README.md "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "playpilot-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "stage/$name", dist | Out-Null
          Copy-Item "target/$env:TARGET/release/playpilot.exe", README.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The owner configures required reviewers on this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum playpilot-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/playpilot-*.tar.gz
            dist/playpilot-*.zip
      - name: Create tag and release
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "playpilot v$VERSION" \
            --generate-notes
