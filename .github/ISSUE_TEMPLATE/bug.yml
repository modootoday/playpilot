name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: Command, input and output}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
    validations: {required: true}
  - type: dropdown
    id: severity
    attributes: {label: Severity, options: [low, medium, high]}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: playpilot version or commit}
