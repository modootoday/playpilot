# Device manifest. Values marked "measure" are filled from a read-only inventory
# run on the device; no private host values (hostnames, IPs, paths) go here.
id = "oss-desktop"
remote_control_title = "OSS Desktop"
runtimes = ["windows", "wsl"]
# Lanes this device takes work from (labels on issues/PRs).
lanes = ["needs-windows-run", "needs-gui-check"]
fallback_lanes = ["needs-heavy-build"]
capacity = { windows = 2, wsl = 2 }
human_present = true          # owner uses this PC; GUI quality approval happens here
always_on = "measure"
cpu_threads = "measure"
ram_gb = "measure"
