[package]
name = "playpilot"
version = "0.1.0"
description = "Run Claude Code agents across devices, cloud sessions and containers under one set of rules"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "2"
toml = "1"
playpilot-plugins = { path = "../playpilot-plugins", optional = true }

[features]
# The WASM plugin host for `guard` (PLAYPILOT_POLICY_PLUGINS). Off by default
# to keep the binary and its build small; without it a set variable refuses.
plugins = ["dep:playpilot-plugins"]
