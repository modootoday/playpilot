[package]
name = "playpilot-plugins"
version = "0.1.0"
description = "Sandboxed WASM component host for playpilot policy-check and event-sink plugins"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
sha2 = "0.10"
wasmtime = { version = "51.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[dev-dependencies]
wat = "1.263"
wit-component = "0.263"
wit-parser = "0.263"
