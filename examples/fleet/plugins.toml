apiVersion = "playpilot.io/v1"
kind = "Plugin"
[metadata]
name = "linear-lanes"
[spec]
kind = "wasm-component"                       # or "process" (JSON-RPC over stdio)
interface = "playpilot:fleet/lane-source@1.0.0"
source = { url = "https://github.com/example/linear-lanes/releases/download/v0.1.0/plugin.wasm", sha256 = "<pinned digest>" }
grants = { network = ["api.linear.app"], secrets = ["LINEAR_TOKEN"] }   # nothing else
