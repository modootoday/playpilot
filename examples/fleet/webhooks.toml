apiVersion = "playpilot.io/v1"
kind = "Webhook"
[metadata]
name = "owner-notify"
[spec]
direction = "outbound"
url = { secretRef = "PLAYPILOT_WEBHOOK_URL_OWNER" }      # values never in config
signing = { scheme = "standard-webhooks", secretRef = "PLAYPILOT_WEBHOOK_SECRET_OWNER" }
format = "cloudevents/1.0"
# Type prefixes on dot boundaries, as `events_read` filters.
events = ["com.github.pull_request", "com.github.check_suite.completed"]
