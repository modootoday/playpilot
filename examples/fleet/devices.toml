apiVersion = "playpilot.io/v1"
kind = "Device"
[metadata]
name = "build-node"
annotations = { remoteControlTitle = "Build node" }
[spec]
capabilities = ["os:linux", "os:windows", "toolchain:msvc", "build:heavy", "gui", "human-present"]
roles = ["heavy-builder", "windows-validator"]
primaryLanes = ["heavy-build"]
runtimes = [
  { type = "wsl", capacity = 4 },
  { type = "windows", capacity = 1 },
]
